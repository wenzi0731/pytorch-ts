run:
  name: timegrad_joint
  seed: 42
  device: auto
  output_root: experiments/baseline6
data:
  energy_path: Data/CN03_energy_cleaned.csv
  weather_path: Data/weather_cleaned.csv
  weather_feature_set: pv10
  seq_len: 24
  num_workers: 0
model:
  cell_type: LSTM
  num_layers: 2
  num_cells: 40
  dropout: 0.1
  conditioning_length: 100
  residual_layers: 8
  residual_channels: 8
  dilation_cycle_length: 2
diffusion:
  num_steps: 100
  beta_end: 0.1
  schedule: linear
training:
  epochs: 300
  batch_size: 32
  learning_rate: 0.001
  betas: [0.9, 0.999]
  gradient_clip: 1.0
  ema_decay: 0.0
  val_every: 5
  early_stopping_patience: 12
evaluation:
  batch_size: 8
  sample_chunk_size: 128
  val_scenarios: 20
  test_scenarios: 100
  precision_recall_k: 5
  max_precision_samples: 10000
